name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync source to droplet
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -az --delete --exclude=node_modules --exclude=dist --exclude=.git --exclude=.cache
          path: ./
          remote_path: izabi-backend/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: root
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trigger rebuild + restart on droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: api
